<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a0f"/>
      <stop offset="50%" stop-color="#0b1726"/>
      <stop offset="100%" stop-color="#03070c"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00ff66"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00ff66" stroke-width="0.3" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <style>
    @keyframes scan {
      0% { transform: translateY(0); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(220px); opacity: 0; }
    }
    @keyframes pulseText {
      0%, 100% { opacity: 0.95; filter: drop-shadow(0 0 8px #00ff66); }
      50% { opacity: 1; filter: drop-shadow(0 0 16px #00f0ff); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .scanner {
      animation: scan 3.5s linear infinite;
    }
    .title-text {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 5px;
      fill: url(#neonGrad);
      animation: pulseText 3s ease-in-out infinite;
    }
    .sub-text {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      letter-spacing: 3px;
      fill: #00f0ff;
      opacity: 0.9;
    }
    .tag-box {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      fill: #00ff66;
    }
    .cursor {
      animation: blink 1s step-start infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="850" height="220" rx="12" fill="url(#bg)" stroke="#00ff66" stroke-width="1.2" stroke-opacity="0.3"/>
  <rect width="850" height="220" rx="12" fill="url(#grid)"/>

  <!-- Scanning Laser Line -->
  <g class="scanner">
    <line x1="10" y1="0" x2="840" y2="0" stroke="#00ff66" stroke-width="2" filter="url(#glow)"/>
  </g>

  <!-- Top Status Bar -->
  <text x="30" y="32" font-family="'Consolas', monospace" font-size="11" fill="#4ade80" letter-spacing="1">● SEC_LEVEL_4 [NODE: ACTIVE]</text>
  <text x="700" y="32" font-family="'Consolas', monospace" font-size="11" fill="#38bdf8" letter-spacing="1">PROTOCOL: DEFENSE</text>
  <line x1="30" y1="42" x2="820" y2="42" stroke="#00ff66" stroke-width="0.5" stroke-opacity="0.25"/>

  <!-- Main Identity Banner -->
  <g transform="translate(425, 95)" text-anchor="middle">
    <text class="title-text" y="0">⚡ UMAR FAROOQUE ⚡</text>
    <text class="sub-text" y="30">[ CYBER DEFENSE APPRENTICE &amp; AI SECURITY BUILDER ]</text>
  </g>

  <!-- Interactive Terminal Badges Row -->
  <g transform="translate(130, 165)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="180" height="28" rx="6" fill="#0b202e" stroke="#00ff66" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="90" y="18" text-anchor="middle" class="tag-box">&gt; APPSEC &amp; PENTESTING</text>
    
    <!-- Badge 2 -->
    <rect x="205" y="0" width="180" height="28" rx="6" fill="#0b202e" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="295" y="18" text-anchor="middle" class="tag-box" fill="#00f0ff">&gt; ADVERSARIAL AI / RAG</text>

    <!-- Badge 3 -->
    <rect x="410" y="0" width="180" height="28" rx="6" fill="#0b202e" stroke="#00ff66" stroke-width="0.8" stroke-opacity="0.4"/>
    <text x="500" y="18" text-anchor="middle" class="tag-box">&gt; THREAT AUTOMATION</text>
  </g>

  <!-- Bottom Console Line -->
  <text x="30" y="208" font-family="'Consolas', monospace" font-size="10" fill="#64748b">> initializing defense pipelines...<tspan class="cursor" fill="#00ff66">_</tspan></text>
</svg>